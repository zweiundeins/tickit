roke="#94a3b8" stroke-width="1.5"/><rect x="563" y="115" width="3" height="3" fill="#94a3b8"/><rect x="567" y="115" width="3" height="3" fill="#94a3b8"/><text x="572" y="139" font-family="ui-sans-serif, system-ui, 'DejaVu Sans', sans-serif" font-size="14" fill="#0f172a" font-weight="600">Smoke</text><text x="572" y="157" font-family="ui-sans-serif, system-ui, 'DejaVu Sans', sans-serif" font-size="12" fill="#64748b">12 checks</text><path d="M676 142L690 142" fill="none" stroke="#475569" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#a)"/><circle cx="662" cy="124" r="4" fill="#14b8a6"/><rect x="690" y="110" width="118" height="64" rx="6" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5"/><rect x="695" y="115" width="3" height="3" fill="#0d9488"/><rect x="699" y="115" width="3" height="3" fill="#0d9488"/><text x="704" y="139" font-family="ui-sans-serif, system-ui, 'DejaVu Sans', sans-serif" font-size="14" fill="#0f172a" font-weight="600">Canary</text><text x="704" y="157" font-family="ui-sans-serif, system-ui, 'DejaVu Sans', sans-serif" font-size="12" fill="#64748b">10 % for 15 min</text><path d="M808 142L822 142" fill="none" stroke="#475569" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#a)"/><circle cx="794" cy="124" r="4" fill="#14b8a6"/><rect x="822" y="110" width="118" height="64" rx="6" fill="#0d9488" stroke="#0f766e" stroke-width="1.5"/><rect x="827" y="115" width="3" height="3" fill="#0f766e"/><rect x="831" y="115" width="3" height="3" fill="#0f766e"/><text x="836" y="139" font-family="ui-sans-serif, system-ui, 'DejaVu Sans', sans-serif" font-size="14" fill="#ffffff" font-weight="600">Production</text><text x="836" y="157" font-family="ui-sans-serif, system-ui, 'DejaVu Sans', sans-serif" font-size="12" fill="#ccfbf1">100 %</text><circle cx="926" cy="124" r="4" fill="#14b8a6"/><path d="M820 180L820 250L700 250" fill="none" stroke="#f43f5e" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#a)" stroke-dasharray="5 4"/><text x="690" y="255" font-family="ui-monospace, 'DejaVu Sans Mono', monospace" font-size="13" fill="#be123c" text-anchor="end" font-weight="600">alp deploy rollback summit</text><text x="30" y="230" font-family="ui-sans-serif, system-ui, 'DejaVu Sans', sans-serif" font-size="13" fill="#334155">A deploy takes about 14 minutes.</text><text x="30" y="250" font-family="ui-sans-serif, system-ui, 'DejaVu Sans', sans-serif" font-size="13" fill="#334155">Canary errors above 1 % stop it by themselves.</text><text x="30" y="320" font-family="ui-sans-serif, system-ui, 'DejaVu Sans', sans-serif" font-size="12" fill="#64748b">No deploys on Friday after 15:00, and none during a sale&#39;s first hour.</text></svg>

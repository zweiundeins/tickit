xt><path d="M670 292L718 176" fill="none" stroke="#475569" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#a)" stroke-dasharray="5 4"/><text x="30" y="250" font-family="ui-sans-serif, system-ui, 'DejaVu Sans', sans-serif" font-size="13" fill="#334155">An edit reaches search in under 5 seconds.</text><text x="30" y="270" font-family="ui-sans-serif, system-ui, 'DejaVu Sans', sans-serif" font-size="13" fill="#334155">A rebuild writes a new index and moves the</text><text x="30" y="290" font-family="ui-sans-serif, system-ui, 'DejaVu Sans', sans-serif" font-size="13" fill="#334155">alias when it is complete, so search never</text><text x="30" y="310" font-family="ui-sans-serif, system-ui, 'DejaVu Sans', sans-serif" font-size="13" fill="#334155">shows half an index.</text></svg>

version: '3'

vars:
  BIN: tickit

tasks:
  generate:
    desc: Compile the templ views
    cmds:
      - go tool templ generate

  dev:
    desc: Serve on http://127.0.0.1:8080 and rebuild on every change (air)
    cmds:
      - go tool air

  test:
    desc: Vet, check the formatting, run the tests
    deps: [generate]
    cmds:
      - go vet ./...
      - test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - go test ./...

  test-race:
    desc: The tests with the race detector, which takes several times as long; for milestones and CI
    deps: [generate]
    cmds:
      - go test -race ./...

  e2e:
    desc: The browser tests in Chromium (CHROME, LITH_CHROME_NO_SANDBOX=1 where it has no sandbox)
    deps: [generate]
    env:
      CHROME: '{{.CHROME | default "/usr/bin/chromium"}}'
    cmds:
      - go test -count=1 ./e2e/

  build:
    desc: Build the static binary, everything embedded
    deps: [generate]
    vars:
      VERSION:
        sh: git describe --tags --match 'v[0-9]*' --always --dirty 2>/dev/null || echo dev
    env:
      CGO_ENABLED: '0'
    cmds:
      - go build -trimpath -ldflags "-s -w -X main.version={{.VERSION}}" -o {{.BIN}} ./cmd/tickit

  smoke:
    desc: Build the binary and check it as the host runs it (deploy/smoke-test.sh)
    deps: [build]
    cmds:
      - bash deploy/smoke-test.sh ./{{.BIN}}

  vuln:
    desc: Known vulnerabilities in the code the binary calls (govulncheck)
    cmds:
      - go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

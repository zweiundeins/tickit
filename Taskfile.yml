version: "3"

env:
  NATS_PORT: 4222
  STATIC_DIR: "web/ui/static"

tasks:
  # The `build:` tasks below are used together for production builds of a project
  build:templ:
    cmds:
      - go tool templ generate
    sources:
      - "**/*.templ"
    generates:
      - "**/*_templ.go"

  build:esbuild:
    cmds:
      - go run cmd/web/build/main.go
    sources:
        - "web/ui/js/**/*"
        - "web/ui/styles/**/*"
    generates:
      - "{{.STATIC_DIR}}/index.css"
      - "{{.STATIC_DIR}}/index.mjs"

  build:windows:
    cmds:
      - GOOS=windows GOARCH=amd64 go build -tags=prod -o bin/main.exe ./cmd/web
    deps:
      - build:templ
      - build:esbuild

  build:
    cmds:
      - go build -tags=prod -o bin/main ./cmd/web
    deps:
      - build:templ
      - build:esbuild

  # Use this task to debug with the delve debugger
  debug:
    cmds:
      - go tool dlv exec ./bin/main
    deps:
      - build

  # The `live:` tasks below are used together for development builds and will live-reload the entire project
  live:templ:
    cmds:
      - go tool templ generate --watch

  live:esbuild:
    cmds:
      - go run cmd/web/build/main.go --watch

  live:server:
    cmds:
      - |
        go tool air  \
         -build.cmd "go build -tags=dev -o tmp/bin/main ./cmd/web" \
         -build.bin "tmp/bin/main" \
         -build.exclude_dir "data,node_modules" \
         -build.include_ext "go,templ" \
         -build.stop_on_error "false" \
         -build.send_interrupt "true" \
         -build.kill_delay "200" \
         -misc.clean_on_exit "true"

  live:
    deps:
      - live:templ
      - live:esbuild
      - live:server

  run:
    cmds:
      - ./bin/main
    deps:
      - build

  default:
    cmds:
      - task: live

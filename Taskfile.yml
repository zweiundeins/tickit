version: '3'

vars:
  BIN: tickit

tasks:
  generate:
    desc: Compile the templ views
    cmds:
      - go tool templ generate

  dev:
    desc: Serve on http://127.0.0.1:8080 and rebuild on every change (air)
    cmds:
      - go tool air

  test:
    desc: Vet, check the formatting, run the tests
    deps: [generate]
    cmds:
      - go vet ./...
      - test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - go test ./...

  test-race:
    desc: The tests with the race detector, which takes several times as long; for milestones and CI
    deps: [generate]
    cmds:
      - go test -race ./...

  e2e:
    desc: The browser tests in Chromium (CHROME, LITH_CHROME_NO_SANDBOX=1 where it has no sandbox)
    deps: [generate]
    env:
      CHROME: '{{.CHROME | default "/usr/bin/chromium"}}'
    cmds:
      - go test -count=1 ./e2e/

  load:
    desc: The load of NFR-38 against the binary in its own process (cmd/tickit-load; LOAD_DIR, LOAD_SECONDS, LOAD_SUSTAIN, SERVER_CPUS, LOAD_CPUS)
    deps: [build]
    vars:
      DIR: '{{.LOAD_DIR | default "/tmp/tickit-load"}}'
      SECONDS: '{{.LOAD_SECONDS | default "60"}}'
      SUSTAIN: '{{.LOAD_SUSTAIN | default "0"}}'
    cmds:
      - mkdir -p {{.DIR}}
      - go build -o {{.DIR}}/tickit-load ./cmd/tickit-load
      # The data of NFR-38.2, once: 10,000 issues, 2,000 pages, 1,000,000 events (about 7 minutes).
      - test -f {{.DIR}}/base.db || {{.DIR}}/tickit-load gen -db {{.DIR}}/base.db
      - >-
        {{if .LOAD_CPUS}}taskset -c {{.LOAD_CPUS}} {{end}}{{.DIR}}/tickit-load run -bin ./{{.BIN}} -base {{.DIR}}/base.db
        -seconds {{.SECONDS}} -sustain {{.SUSTAIN}}{{if .SERVER_CPUS}} -server-cpus {{.SERVER_CPUS}}{{end}} -out {{.DIR}}/results.json

  build:
    desc: Build the static binary, everything embedded
    deps: [generate]
    vars:
      VERSION:
        sh: git describe --tags --match 'v[0-9]*' --always --dirty 2>/dev/null || echo dev
    env:
      CGO_ENABLED: '0'
    cmds:
      - go build -trimpath -ldflags "-s -w -X main.version={{.VERSION}}" -o {{.BIN}} ./cmd/tickit

  smoke:
    desc: Build the binary and check it as the host runs it (deploy/smoke-test.sh)
    deps: [build]
    cmds:
      - bash deploy/smoke-test.sh ./{{.BIN}}

  vuln:
    desc: Known vulnerabilities in the code the binary calls (govulncheck)
    cmds:
      - go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  vendor-starbase:
    desc: Copy Starbase's components and fonts from a checkout (STARBASE=/path/to/starbase)
    cmds:
      - go run ./cmd/vendor-starbase -src {{.STARBASE}}
    requires:
      vars: [STARBASE]
